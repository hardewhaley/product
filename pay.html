<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKOUT</title>
    <link rel="stylesheet" href="product.css">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
      <div>
        <i class="fa-solid fa-moon moon-icon" id="icon"></i>
     </div>
    <div class="out"><i class="fa-regular fa-credit-card"></i> Checkout</div>
    <div class="general">
        <div class="right-container">
            <p class="del">Delivery Information</p>
            <form action="">
                <label for="">Full Name</label><br>
                <input type="text" name="fullName"><br><br>
                <label for="">Email</label><br>
                <input type="email" name="email"><br><br>
                <label for="">WhatsApp Number</label><br>
                <input type="text" name="WhatsApp"><br><br>
                <label for="">Delivery Address</label><br>
                <textarea name="textarea" id="textarea"></textarea>
            </form>
            <div class="paid">
                <p><i class="fa-solid fa-bag-shopping"></i> Delivery is only within Ibadan</p>
                <p> <i class="fa-solid fa-money-check-dollar"></i> Delivery fee is paid on delivery</p>
                <p><i class="fa-solid fa-phone"></i> We will contact you immediately after payment
                </p>
            </div>
        </div>
        <div class="left-container">
            <h3>Order Summary</h3>
            <div id="orderItems">
                <!-- <p>Snug World (x2)</p>
                <p>120</p> -->
            </div>
            <p class="bottom"></p>
            <p>Total: <span id="orderTotal">0</span></p>
            <button id="whatsappBtn">Checkout via WhatsApp <i class="fa-brands fa-whatsapp"></i></button>
        </div>
    </div>
</body>
<script src="pay.js"></script>
</html>
